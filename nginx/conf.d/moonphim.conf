# ========================================
# HTTP → HTTPS redirect + Certbot challenge
# ========================================
server {
    listen 80;
    server_name moonphim.me www.moonphim.me;

    # Certbot challenge (cần để lấy SSL certificate)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========================================
# HTTPS server
# ========================================
server {
    listen 443 ssl;
    http2 on;
    server_name moonphim.me www.moonphim.me;

    # SSL certificates từ Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/moonphim.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moonphim.me/privkey.pem;

    # SSL settings tối ưu (Chỉ cho phép TLS 1.2 và TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    server_tokens off;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (Bảo mật tối đa, tương thích hoàn toàn video HLS, SignalR, Firebase, Stripe, Turnstile, Ads)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://js.stripe.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://*.monetag.com https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://use.fontawesome.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com https://use.fontawesome.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' blob: https: wss://moonphim.me wss://*.moonphim.me https://api.stripe.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com https://js.stripe.com https://www.youtube.com https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Static files cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://app:5000;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # APK Downloads (Direct & Never Cached)
    location /downloads/ {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SignalR WebSocket support (Notification & Watch Party)
    location ~* ^/(notificationHub|watchPartyHub) {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Tất cả các request còn lại → proxy tới app
    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Cookie forwarding
        proxy_pass_header Set-Cookie;
    }
}
